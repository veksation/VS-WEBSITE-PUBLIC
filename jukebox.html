<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jukebox — Vex &amp; Shell</title><meta name="description" content="Listen to 30-second previews of the Vex &amp; Shell soundtrack." />
  <meta name="theme-color" content="#3F3F73" />
  <link rel="icon" type="image/webp" href="assets/Sprites/websiteTabLogo.webp" />
  <link rel="stylesheet" href="css/styles.css" /><link rel="stylesheet" href="css/showcase.css" />
  <link rel="stylesheet" href="css/encounters.css" /><link rel="stylesheet" href="css/pages.css" />
<link rel="stylesheet" href="css/refinements.css" /><link rel="stylesheet" href="css/explore-ring.css?v=radial-submenus" /><link rel="stylesheet" href="css/panel-textures.css" /><link rel="stylesheet" href="css/responsive.css" /></head><body class="detail-page music-page" data-boil="0">
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <filter id="marker-ink" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.45" numOctaves="2" seed="8" result="grain" />
        <feColorMatrix in="grain" type="matrix" values=".12 0 0 0 0  .12 0 0 0 0  .12 0 0 0 0  0 0 0 0 1" />
        <feComposite in2="SourceAlpha" operator="in" result="strokes" />
        <feBlend in="SourceGraphic" in2="strokes" mode="screen" result="ink" />
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="edge" />
        <feDisplacementMap in="ink" in2="edge" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="rough-0" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="rough-1" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="rough-2" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="17" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <canvas id="sketch-bg" aria-hidden="true"></canvas><div class="dither" aria-hidden="true"></div>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header" id="top"><noscript><a href="index.html">Sandy Studio · Home</a></noscript></header>
  <main id="main-content">    <!-- ============ MUSIC: only short excerpt files belong here ============ -->
    <section class="section" aria-labelledby="preview-title"><header class="section__head"><h1 class="scribble-title" id="preview-title">The jukebox</h1></header>
      <p class="showcase-intro">Four samples of the Vex &amp; Shell soundtrack.</p>
      <div class="jukebox sketch" id="jukebox">
        <div class="jukebox__scope" aria-label="Music waveform oscilloscope">
          <div class="jukebox__scope-head"><span>Oscilloscope</span><span class="jukebox__scope-state" id="scope-state">Ready</span></div>
          <canvas class="jukebox__scope-screen" id="music-scope" width="240" height="160" aria-hidden="true"></canvas>
        </div>
        <div class="jukebox__body">
          <h3 id="music-track-title">Title Theme</h3>
          <div class="jukebox__tracks" id="music-tracks" aria-label="Choose a music preview"></div>
          <div class="jukebox__transport">
            <button class="btn btn--primary" id="music-play" type="button" aria-pressed="false">Play preview ▷</button>
            <button class="btn btn--ghost" id="music-restart" type="button">Restart</button>
          </div>
          <div class="jukebox__progress">
            <progress id="music-progress" value="0" max="30" aria-label="Music preview progress"></progress>
            <span id="music-time">0:00 / 0:30</span>
          </div>
          <label class="jukebox__volume">Volume <input id="music-volume" type="range" min="0" max="1" step="0.05" value="0.6" /></label>
          <p class="jukebox__note">30 seconds of some of the game's music, all by our composers.</p>
          <p class="jukebox__status" id="music-status" role="status"></p>
          <audio id="music-audio" preload="none"></audio>
        </div>
      </div>
<div class="music-page-links"><a class="btn btn--outline" href="music.html">Meet the composers</a></div></section>
